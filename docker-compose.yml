services:
  minio:
    image: minio/minio:latest
    container_name: skill-platform-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: skill-platform-server
    ports:
      - "3456:3456"
    environment:
      - PORT=3456
      - DATABASE_URL=/data/skill-platform.sqlite
      - STORAGE_TYPE=local
      - STORAGE_DIR=/data/storage
    volumes:
      - server_data:/data
    restart: unless-stopped
    depends_on:
      - minio

volumes:
  minio_data:
  server_data:
